services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: devia
      POSTGRES_USER: devia
      POSTGRES_PASSWORD: devia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devia -d devia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: rihem202/codeagent-backend:${DOCKER_TAG:-latest}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://devia:devia@postgres:5432/devia
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    image: rihem202/codeagent-frontend:${DOCKER_TAG:-latest}
    environment:
      VITE_API_URL: "https://your-backend-url.example.com"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: