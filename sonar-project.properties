sonar.projectKey=codeagent
sonar.projectName=CodeAgent
sonar.projectVersion=1.0

# Sources à analyser
sonar.sources=api,agents,core,config,utils,frontend/src
sonar.tests=tests

# Encodage
sonar.sourceEncoding=UTF-8

# Langages
sonar.language=

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/output/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/.tools/**,\
  **/.git/**,\
  **/target/**,\
  **/rapport_pfe_Rihem/**,\
  **/powerpoint/**,\
  **/uploaded-projects/**,\
  **/*.pyc,\
  **/devia_local.db

# Exclusions des tests de la couverture
sonar.coverage.exclusions=\
  **/tests/**,\
  **/test_*.py,\
  **/*_test.py

# Python
sonar.python.version=3.11
